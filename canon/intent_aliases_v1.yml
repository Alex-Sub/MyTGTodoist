version: "1.0"

intents:
  meeting.update:
    phrases:
      - "перенеси встречу"
      - "сдвинь встречу"
      - "поменяй время встречи"
      - "перенеси на завтра"
      - "давай на 16"
      - "перенеси созвон"
    subject_patterns:
      - "встреч"
      - "созвон"
      - "митинг"
      - "мероприят"
      - "событ"
    action_patterns:
      - "перенес"
      - "сдвин"
      - "поменя"
      - "давай"
      - "подвин"

  meeting.create:
    phrases:
      - "назначь встречу"
      - "запланируй встречу"
      - "поставь созвон"
      - "запланируй мероприятие"
    subject_patterns:
      - "встреч"
      - "созвон"
      - "собран"
      - "митинг"
      - "мероприят"
      - "событ"
    action_patterns:
      - "назнач"
      - "запланир"
      - "постав"
      - "созда"
      - "добав"

  task.create:
    phrases:
      - "создай задачу"
      - "добавь задачу"
      - "запиши задачу"
      - "напомни сделать"
    subject_patterns:
      - "задач"
      - "таск"
      - "сделать"
      - "позвонить"
      - "отправить"
      - "написать"
      - "согласовать"
      - "проверить"
      - "подготовить"
    action_patterns:
      - "создай"
      - "добавь"
      - "запиши"
      - "напомни"
      - "надо"
      - "нужно"

  timeblock.create:
    phrases:
      - "забронируй время"
      - "забронируй слот"
      - "выдели время"
      - "запланируй время"
      - "выдели слот"
      - "поставь блок"
      - "поставь время"
      - "нужен слот"
      - "нужно время"
      - "забронируй час на задачу"
      - "выдели время на задачу"
      - "поставь время под задачу"
      - "забронируй слот под задачу"
    subject_patterns:
      - "блок"
      - "таймблок"
      - "timeblock"
      - "слот"
      - "задач"
      - "дел"
      - "работ"
      - "время на задач"
      - "тайм"
    action_patterns:
      - "забронир"
      - "выдел"
      - "запланир"
      - "постав"
      - "блокир"
      - "зарезерв"
