services:
  telegram-bot:
    # NOTE: Docker log rotation enabled to prevent disk overflow on VPS
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # Primary production override: keep telegram adapter on canonical direct runtime path.
    environment:
      TELEGRAM_ADAPTER_MODE: "runtime_core_direct"
      DIRECT_VOICE_ENABLED: "true"
      DIRECT_ASR_TIMEOUT_SEC: ${DIRECT_ASR_TIMEOUT_SEC:-45}
      DIRECT_ASR_RETRIES: ${DIRECT_ASR_RETRIES:-1}
      WORKER_COMMAND_URL: "http://organizer-worker:8002/runtime/command"
      TELEGRAM_POLL_TIMEOUT_SEC: "25"
      TELEGRAM_HTTP_TIMEOUT_SEC: "40"
